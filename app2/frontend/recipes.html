<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AegisIL — מתכונים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Rubik:wght@600;700&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .search-box { display: flex; gap: 12px; margin-bottom: 24px; }
  .search-box input { flex: 1; font-size: 15px; padding: 12px 16px; }
  .search-btn { background: var(--primary); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-family: 'Heebo', sans-serif; cursor: pointer; font-weight: 600; transition: opacity 0.15s; }
  .search-btn:hover { opacity: 0.85; }
  .search-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .recipes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .recipe-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color 0.15s; }
  .recipe-card:hover { border-color: var(--primary); }
  .recipe-img { width: 100%; height: 180px; object-fit: cover; background: var(--surface2); display: block; }
  .recipe-img-placeholder { width: 100%; height: 180px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 48px; }
  .recipe-body { padding: 16px; }
  .recipe-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
  .recipe-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .recipe-tag { font-size: 11px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 2px 10px; color: var(--text2); }
  .recipe-desc { font-size: 12px; color: var(--text2); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .chef-header { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 24px; display: flex; align-items: center; gap: 16px; }
  .chef-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
  .chef-name { font-size: 20px; font-weight: 700; font-family: 'Rubik', sans-serif; }
  .chef-count { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text2); }
  .empty-state .icon { font-size: 56px; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; }
</style>
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-logo">⬡ AegisIL<span>מערכת מודיעין פשיעה</span></div>
  <a class="nav-item" href="index.html"><span class="nav-icon">📊</span> לוח בקרה</a>
  <a class="nav-item" href="incidents.html"><span class="nav-icon">📋</span> אירועים</a>
  <a class="nav-item" href="resources.html"><span class="nav-icon">🗂️</span> ניהול משאבים</a>
  <a class="nav-item" href="chat.html"><span class="nav-icon">💬</span> צ'אט מודיעין</a>
  <a class="nav-item active" href="recipes.html"><span class="nav-icon">🍳</span> מתכונים</a>
</nav>
<div class="main">
  <div class="topbar">
    <div class="topbar-title">חיפוש מתכונים לפי שף</div>
    <div class="topbar-time" id="clock"></div>
  </div>
  <div class="content">

    <div class="search-box">
      <input id="chef-input" placeholder="הכנס שם שף..." onkeydown="if(event.key==='Enter') search()">
      <button class="search-btn" id="search-btn" onclick="search()">🔍 חפש מתכונים</button>
    </div>

    <div id="result-area">
      <div class="empty-state">
        <div class="icon">👨‍🍳</div>
        <p>הכנס שם שף וחפש את המתכונים שלו</p>
      </div>
    </div>

  </div>
</div>

<script>
const MAKE_WEBHOOK = 'https://hook.eu1.make.com/ex58u4uaqcncsyaavppnfv5qbpevn9kk';

function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('he-IL'); }
setInterval(updateClock, 1000); updateClock();

async function search() {
  const chef = document.getElementById('chef-input').value.trim();
  if (!chef) return;

  const btn = document.getElementById('search-btn');
  btn.disabled = true;
  btn.textContent = 'מחפש...';

  document.getElementById('result-area').innerHTML = `
    <div class="loading"><div class="spinner"></div><br>מחפש מתכונים של ${chef}...</div>`;

  try {
    const res = await fetch(MAKE_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chef, timestamp: new Date().toISOString() })
    });

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = []; }

    // Make warning response
    if (typeof data === 'object' && !Array.isArray(data) && data.warning) {
      document.getElementById('result-area').innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <p>הסצנריו ב-Make לא מוגדר כ-"Immediately"</p>
          <p style="margin-top:8px;font-size:12px">פתח את Make → Scheduling → שנה ל-Immediately</p>
        </div>`;
      return;
    }

    renderResults(chef, data);
  } catch (e) {
    document.getElementById('result-area').innerHTML = `
      <div class="loading" style="color:#EF4444">
        שגיאה בחיפוש: ${e.message}<br>
        <small style="color:var(--text2)">בדוק שה-webhook ב-Make פעיל</small>
      </div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 חפש מתכונים';
  }
}

function renderResults(chef, data) {
  // תמיכה במבנים שונים שעשויים לחזור מ-Make
  const recipes = Array.isArray(data) ? data
    : data.recipes ? data.recipes
    : data.results ? data.results
    : [];

  if (!recipes.length) {
    document.getElementById('result-area').innerHTML = `
      <div class="empty-state">
        <div class="icon">🔍</div>
        <p>לא נמצאו מתכונים עבור "${chef}"</p>
      </div>`;
    return;
  }

  const cards = recipes.map(r => `
    <div class="recipe-card">
      ${r.image
        ? `<img class="recipe-img" src="${r.image}" alt="${r.title || ''}" onerror="this.style.display='none'">`
        : `<div class="recipe-img-placeholder">🍽️</div>`}
      <div class="recipe-body">
        <div class="recipe-title">${r.title || r.name || 'מתכון'}</div>
        <div class="recipe-meta">
          ${r.duration ? `<span class="recipe-tag">⏱ ${r.duration}</span>` : ''}
          ${r.difficulty ? `<span class="recipe-tag">📊 ${r.difficulty}</span>` : ''}
          ${r.category ? `<span class="recipe-tag">🏷 ${r.category}</span>` : ''}
        </div>
        ${r.description ? `<div class="recipe-desc">${r.description}</div>` : ''}
      </div>
    </div>`).join('');

  document.getElementById('result-area').innerHTML = `
    <div class="chef-header">
      <div class="chef-avatar">👨‍🍳</div>
      <div>
        <div class="chef-name">${chef}</div>
        <div class="chef-count">${recipes.length} מתכונים נמצאו</div>
      </div>
    </div>
    <div class="recipes-grid">${cards}</div>`;
}
</script>
</body>
</html>
